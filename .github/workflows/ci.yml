name: CI
on:
  push:
    branches: [main, 'release/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: PowerShell scripts parse
        shell: pwsh
        run: |
          $problems = @()
          Get-ChildItem scripts -Filter *.ps1 -Recurse | ForEach-Object {
            $parseErrors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$parseErrors)
            if ($parseErrors) { $problems += $parseErrors | ForEach-Object { "$($_.Extent.File):$($_.Extent.StartLineNumber) $($_.Message)" } }
          }
          if ($problems) { $problems | ForEach-Object { Write-Host "::error::$_" }; exit 1 }
      - name: Restore
        run: dotnet restore src/backend/GameCore.sln
      - name: Build (Release)
        run: dotnet build src/backend/GameCore.sln -c Release --no-restore
      - name: Test (unit + API over SQLite)
        run: dotnet test src/backend/GameCore.sln -c Release --no-build
      - name: NuGet vulnerability audit
        run: |
          dotnet list src/backend/GameCore.sln package --vulnerable --include-transitive 2>&1 | tee nuget-audit.txt
          if grep -q "has the following vulnerable packages" nuget-audit.txt; then
            echo "::error::Vulnerable NuGet packages detected."
            exit 1
          fi

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm audit --audit-level=high

  full-stack:
    # Builds and starts the real docker compose stack from scratch (SQL Server + db-init + API + frontend),
    # then runs the PowerShell smoke test and the SQL Server integration tests against it.
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GAMECORE_TEST_SQLSERVER: Server=localhost,1433;Database=GameCoreDB;User Id=sa;Password=GameCore_Local_2026!;TrustServerCertificate=True
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Validate compose file
        run: docker compose config --quiet
      - name: Start stack from scratch
        run: docker compose up -d --build
      - name: Wait for API health (includes database)
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/health; then echo; exit 0; fi
            if [ "$(docker inspect -f '{{.State.Status}} {{.State.ExitCode}}' gamecore-db-init-1 2>/dev/null)" = "exited 1" ]; then
              echo "::error::db-init failed"; exit 1
            fi
            sleep 5
          done
          echo "::error::API did not become healthy"; exit 1
      - name: Frontend responds
        run: curl -fsS http://localhost:5173/ | grep -q '<div id="root">'
      - name: Smoke test
        shell: pwsh
        run: ./scripts/smoke-test.ps1 -ApiUrl http://localhost:8080
      - name: SQL Server integration tests
        run: dotnet test src/backend/GameCore.sln -c Release --filter "FullyQualifiedName~GameCore.Tests.SqlServer"
      - name: Install sqlcmd (mssql-tools18) for the PowerShell scripts
        run: |
          sudo apt-get update -q
          if ! apt-cache show mssql-tools18 >/dev/null 2>&1; then
            curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
            curl -fsSL https://packages.microsoft.com/config/ubuntu/24.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
            sudo apt-get update -q
          fi
          sudo ACCEPT_EULA=Y apt-get install -y -q mssql-tools18
          echo /opt/mssql-tools18/bin >> "$GITHUB_PATH"
      - name: setup-db.ps1 -Reset (destructive path + full create from PowerShell)
        shell: pwsh
        run: |
          ./scripts/setup-db.ps1 -Server 'localhost,1433' -User sa -Password 'GameCore_Local_2026!' -Reset -Force
          ./scripts/setup-db.ps1 -Server 'localhost,1433' -User sa -Password 'GameCore_Local_2026!'   # existing DB: validate only
      - name: Wait for API after database rebuild
        run: |
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/health && exit 0; sleep 2; done
          exit 1
      - name: release-check.ps1 (DB, builds, tests, audits, API, smoke, SQL Server tests)
        shell: pwsh
        run: ./scripts/release-check.ps1 -ApiUrl http://localhost:8080 -Server 'localhost,1433' -SqlUser sa -SqlPassword 'GameCore_Local_2026!' -IncludeSqlServerTests
      - name: Restart keeps existing database (db-init is non-destructive)
        run: docker compose run --rm db-init | tee db-init-rerun.log && grep -q "Existing GameCoreDB is valid" db-init-rerun.log
      - name: Upgrade path (pre-v1.0.0 database -> upgrade-v1.sql -> valid)
        run: |
          docker compose run --rm -v "$PWD/.github/ci:/ci:ro" --entrypoint /bin/bash db-init -c '
            set -euo pipefail
            S=/opt/mssql-tools18/bin/sqlcmd; [ -x "$S" ] || S=/opt/mssql-tools/bin/sqlcmd
            run() { "$S" -S sqlserver -U sa -P "$MSSQL_SA_PASSWORD" -C -I -b -f 65001 -i "$1"; }
            cd /gamecore
            run /ci/simulate-pre-v1.sql
            if run database/validate.sql; then echo "validate.sql should reject the pre-v1 schema"; exit 1; fi
            run database/upgrade-v1.sql
            run database/upgrade-v1.sql   # idempotent
            run database/validate.sql
            run database/advanced/validate.sql
            echo "Upgrade path OK"'
      - name: Compose logs
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
